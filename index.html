<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STYLE 兒童單字拼字大挑戰</title>
    <style>
        :root {
            --primary: #FF7675;
            --secondary: #74B9FF;
            --success: #2ECC71;
            --danger: #FF7675;
            --bg: #FEF9E7;
            --text: #2C3E50;
        }

        * {
            box-sizing: border-box;
            font-family: 'Comic Sans MS', 'Segoe UI', Tahoma, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .app-container {
            background: white;
            border-radius: 32px;
            box-shadow: 0 15px 35px rgba(222, 184, 135, 0.3);
            border: 4px solid #FFEAA7;
            width: 100%;
            max-width: 500px;
            padding: 25px;
            text-align: center;
            position: relative;
        }

        h1 {
            font-size: 2.2rem;
            color: #E67E22;
            margin-top: 5px;
            margin-bottom: 5px;
        }

        .subtitle {
            color: #7F8C8D;
            margin-bottom: 25px;
            font-size: 1.1rem;
        }

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        /* 關卡選擇鈕 */
        .level-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }

        .btn-level {
            background: #FFF9E6;
            border: 3px solid #FFEAA7;
            border-radius: 20px;
            padding: 18px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #D35400;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-level.selected {
            background: #FF7675;
            border-color: #FF7675;
            color: white;
            transform: translateY(-3px);
            box-shadow: 0 5px 10px rgba(255,118,117,0.3);
        }

        .btn-main {
            background: #2ECC71;
            color: white;
            border: none;
            border-radius: 50px;
            padding: 15px 40px;
            font-size: 1.4rem;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 6px 0 #27AE60;
            transition: all 0.1s;
        }

        .btn-main:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #27AE60;
        }

        /* 遊戲區域頂部 Header */
        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .btn-home-back {
            background: #95A5A6;
            color: white;
            border: none;
            border-radius: 12px;
            padding: 8px 16px;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 3px 0 #7F8C8D;
            transition: all 0.1s;
        }

        .btn-home-back:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #7F8C8D;
        }

        /* 倒數計時器 */
        .timer-container {
            font-size: 2.2rem;
            font-weight: bold;
            color: #E67E22;
            margin: 10px 0 20px 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: #FFF2E6;
            border-radius: 20px;
            padding: 6px 20px;
            border: 3px solid #FFEAA7;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.05);
            transition: all 0.3s ease;
        }

        .timer-urgent {
            color: #E74C3C;
            background: #FCE8E6;
            border-color: #F8B4B4;
            animation: pulse-red 1s infinite;
        }

        @keyframes pulse-red {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        /* 遊戲進度條 */
        .progress-container {
            background: #F1F2F6;
            border-radius: 10px;
            height: 14px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .progress-bar {
            background: #2ECC71;
            height: 100%;
            width: 0%;
            transition: width 0.3s;
        }

        .chinese-prompt {
            font-size: 2.8rem;
            font-weight: bold;
            color: #2C3E50;
            background: #F8EFBA;
            display: inline-block;
            padding: 5px 25px;
            border-radius: 20px;
            margin-bottom: 25px;
        }

        /* 填空格子 */
        .slots-container {
            display: flex;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
            min-height: 55px;
            margin-bottom: 20px;
        }

        .slot {
            width: 45px;
            height: 50px;
            border-bottom: 4px solid #BDC3C7;
            font-size: 2rem;
            font-weight: bold;
            color: #2980B9;
            text-transform: uppercase;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .slot.filled {
            border-bottom: 4px solid #3498DB;
            animation: bounce 0.15s ease;
        }

        @keyframes bounce {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        .control-row {
            margin-bottom: 30px;
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .btn-control {
            color: white;
            border: none;
            border-radius: 12px;
            padding: 8px 18px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 3px 0 rgba(0,0,0,0.15);
        }
        .btn-clear { background: #E74C3C; }
        .btn-repeat-sound { background: #3498DB; }

        /* 糖果字母池 */
        .letter-pool {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            background: #F5F6FA;
            padding: 15px;
            border-radius: 20px;
            border: 2px dashed #CDD1D5;
        }

        .letter-tile {
            background: white;
            border: 2px solid #DECBC6;
            border-radius: 15px;
            width: 50px;
            height: 50px;
            font-size: 1.6rem;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 4px 0 #DECBC6;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.1s;
        }

        .letter-tile:active:not(.disabled) {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #DECBC6;
        }

        .letter-tile.disabled {
            background: #E4E7EB;
            color: #A1A8B0;
            border-color: #E4E7EB;
            box-shadow: none;
            cursor: not-allowed;
            transform: translateY(4px);
        }

        .feedback-message {
            font-size: 1.4rem;
            font-weight: bold;
            margin-top: 15px;
            height: 30px;
        }
        .text-success { color: #2ECC71; }
        .text-danger { color: #E74C3C; }

        /* 結果結算 */
        .score-display {
            font-size: 5rem;
            font-weight: bold;
            color: #FF7675;
            margin: 15px 0;
        }
        .review-box {
            text-align: left;
            background: #F7FAFC;
            padding: 15px;
            border-radius: 16px;
            max-height: 180px;
            overflow-y: auto;
            margin-bottom: 25px;
        }

        /* 自訂覆蓋用提示對話框 */
        .custom-dialog {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .custom-dialog-box {
            background: white;
            padding: 25px;
            border-radius: 24px;
            max-width: 400px;
            width: 85%;
            text-align: center;
            border: 4px solid #FFEAA7;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        .dialog-title {
            font-size: 1.5rem;
            font-weight: bold;
            color: #E67E22;
            margin-bottom: 15px;
        }
        .dialog-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
        }
        .btn-dialog {
            padding: 10px 25px;
            border: none;
            border-radius: 15px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-dialog-yes { background: #E74C3C; color: white; }
        .btn-dialog-no { background: #BDC3C7; color: #2C3E50; }
    </style>
</head>
<body>

<div class="app-container">
    <!-- 1. 主選單畫面 -->
    <div id="screen-menu" class="screen active">
        <h1>字母拼字大挑戰 🎈</h1>
        <p class="subtitle">聽聲音、看中文，拼出正確單字！</p>
        
        <div class="level-grid">
            <button class="btn-level selected" onclick="selectLevel(1)">Level 1</button>
            <button class="btn-level" onclick="selectLevel(2)">Level 1 ~ 2</button>
            <button class="btn-level" onclick="selectLevel(3)">Level 1 ~ 3</button>
            <button class="btn-level" onclick="selectLevel(4)">Level 1 ~ 4</button>
            <button class="btn-level" style="grid-column: span 2" onclick="selectLevel(5)">Level 1 ~ 5 全攻略</button>
        </div>

        <button class="btn-main" onclick="startGame()">開始拼字遊戲 ✨</button>
    </div>

    <!-- 2. 遊戲進行畫面 -->
    <div id="screen-game" class="screen">
        <div class="game-header">
            <button class="btn-home-back" onclick="confirmReturnToMenu()">🏠 回首頁</button>
            <span id="question-number">第 1 / 15 題</span>
        </div>

        <!-- 5分鐘倒數計時器 -->
        <div id="timer-box" class="timer-container">
            ⏱️ <span id="timer-display">05:00</span>
        </div>

        <div class="progress-container">
            <div id="progress" class="progress-bar"></div>
        </div>
        
        <div style="display: flex; justify-content: space-between; color: #7F8C8D; font-weight: bold; margin-bottom: 15px;">
            <span>倒數計時中</span>
            <span id="current-score">得分: 0</span>
        </div>

        <div id="chinese-prompt" class="chinese-prompt">蘋果</div>

        <!-- 填空格子列 -->
        <div id="slots" class="slots-container"></div>

        <div class="control-row">
            <button class="btn-control btn-repeat-sound" onclick="repeatCurrentWordAudio()">再聽一次 🔊</button>
            <button class="btn-control btn-clear" onclick="clearAnswer()">重新填寫 ❌</button>
        </div>

        <!-- 字母池 -->
        <div id="letter-pool" class="letter-pool"></div>
        
        <div id="feedback" class="feedback-message"></div>
    </div>

    <!-- 3. 結束結算畫面 -->
    <div id="screen-result" class="screen">
        <h1 id="result-title">挑戰成功 🎉</h1>
        <div id="final-score" class="score-display">100</div>
        <p id="result-message" style="font-size: 1.2rem; margin-bottom: 20px;">太棒了！你全部都拼對了！</p>
        
        <div id="review-section" style="display: none;">
            <p style="text-align: left; font-weight: bold; margin-bottom: 5px; color: var(--danger);">需要多練習的單字：</p>
            <div id="review-list" class="review-box"></div>
        </div>

        <button class="btn-main" onclick="returnToMenu()">再玩一次 🔄</button>
    </div>
</div>

<!-- 4. 自訂確認提示框 -->
<div id="confirm-dialog" class="custom-dialog">
    <div class="custom-dialog-box">
        <div class="dialog-title">確定要離開本次測驗嗎？</div>
        <p style="color: #7F8C8D;">離開後，目前的得分與進度將不會被保存喔！</p>
        <div class="dialog-buttons">
            <button class="btn-dialog btn-dialog-yes" onclick="exitToMenu()">確定離開</button>
            <button class="btn-dialog btn-dialog-no" onclick="closeConfirmDialog()">繼續練習</button>
        </div>
    </div>
</div>

            { w: "dryer", ch: "烘乾機" }, { w: "english", ch: "英文" }, { w: "forest", ch: "森林" },
            { w: "giraffe", ch: "長頸鹿" }, { w: "gorilla", ch: "大猩猩" }, { w: "hippo", ch: "河馬" },
            { w: "honey", ch: "蜂蜜" }, { w: "ketchup", ch: "番茄醬" }, { w: "kitten", ch: "小貓" },
            { w: "lake", ch: "湖泊" }, { w: "magician", ch: "魔術師" }, { w: "mountain", ch: "山" },
            { w: "musician", ch: "音樂家" }, { w: "notebook", ch: "筆記本" }, { w: "oven", ch: "烤箱" },
            { w: "playground", ch: "遊樂場" }, { w: "pork", ch: "豬肉" }, { w: "postcard", ch: "明信片" },
            { w: "puppy", ch: "小狗" }, { w: "river", ch: "河流" }, { w: "sausage", ch: "香腸" },
            { w: "scientist", ch: "科學家" }, { w: "vegetable", ch: "蔬菜" }, { w: "village", ch: "村莊" },
            { w: "wonderful", ch: "極好的" }
        ],
        5: [
            { w: "apartment", ch: "公寓" }, { w: "bakery", ch: "麵包店" }, { w: "typhoon", ch: "颱風" },
            { w: "hospital", ch: "醫院" }, { w: "rainbow", ch: "彩虹" }, { w: "bathtub", ch: "浴缸" },
            { w: "beard", ch: "鬍子" }, { w: "beautiful", ch: "美麗的" }, { w: "bowling", ch: "保齡球" },
            { w: "bridge", ch: "橋樑" }, { w: "church", ch: "教堂" }, { w: "classmate", ch: "同學" },
            { w: "company", ch: "公司" }, { w: "couch", ch: "長沙發" }, { w: "engineer", ch: "工程師" },
            { w: "expensive", ch: "昂貴的" }, { w: "factory", ch: "工廠" }, { w: "hotel", ch: "飯店" },
            { w: "island", ch: "島嶼" }, { w: "library", ch: "圖書館" }, { w: "machine", ch: "機器" },
            { w: "manager", ch: "經理" }, { w: "milkshake", ch: "奶昔" }, { w: "ocean", ch: "海洋" },
            { w: "office", ch: "辦公室" }, { w: "picnic", ch: "野餐" }, { w: "restaurant", ch: "餐廳" },
            { w: "restroom", ch: "洗手間" }, { w: "sidewalk", ch: "人行道" }, { w: "teapot", ch: "茶壺" },
            { w: "uniform", ch: "制服" }, { w: "vacation", ch: "假期" }, { w: "waitress", ch: "女服務生" }
        ]
    };

    let selectedLevel = 1;
    let gameWords = [];
    let currentIdx = 0;
    let score = 0;
    let wrongWords = [];
    let isTransitioning = false;
    
    let currentAnswerArray = []; // 小朋友目前填入的字母
    let usedTileIds = [];        // 記錄哪些按鈕被使用了

    // 計時器變數
    let timerInterval = null;
    let timeLeft = 180; // 3分鐘 = 180秒

    // 🏆 歷史學習記憶庫 (從瀏覽器 LocalStorage 讀取)
    let playedHistory = JSON.parse(localStorage.getItem('style_spelling_played_history')) || [];

    function selectLevel(lvl) {
        selectedLevel = lvl;
        document.querySelectorAll('.btn-level').forEach((btn, idx) => {
            btn.classList.toggle('selected', idx === (lvl - 1));
        });
    }

    function startGame() {
        // 1. 根據所選級別抽取全部單字庫
        let pool = [];
        for (let i = 1; i <= selectedLevel; i++) {
            pool = pool.concat(vocabData[i]);
        }

        // 2. 過濾掉近期已經拼寫過的單字，防止重複
        let unplayed = pool.filter(item => !playedHistory.includes(item.w));

        // 如果未玩過的單字少於 15 個，代表這個級別幾乎學完囉！我們清空該級別的歷史，重新循環
        if (unplayed.length < 15) {
            const poolWordList = pool.map(item => item.w);
            playedHistory = playedHistory.filter(w => !poolWordList.includes(w));
            localStorage.setItem('style_spelling_played_history', JSON.stringify(playedHistory));
            unplayed = pool;
        }

        // 3. Fisher-Yates 隨機洗牌 unplayed 池
        for (let i = unplayed.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [unplayed[i], unplayed[j]] = [unplayed[j], unplayed[i]];
        }

        // 4. 固定抽取 15 題全新單字
        const totalQuestions = Math.min(15, unplayed.length);
        gameWords = unplayed.slice(0, totalQuestions);

        // 5. 將本次抽取的所有單字，寫入已玩過的歷史記憶
        gameWords.forEach(item => {
            if (!playedHistory.includes(item.w)) {
                playedHistory.push(item.w);
            }
        });
        localStorage.setItem('style_spelling_played_history', JSON.stringify(playedHistory));

        currentIdx = 0;
        score = 0;
        wrongWords = [];
        isTransitioning = false;

        // 6. 初始化並啟動計時器 (3 分鐘)
        initTimer(180);
        
        switchScreen('screen-game');
        loadQuestion();
    }

    function initTimer(durationSeconds) {
        clearInterval(timerInterval);
        timeLeft = durationSeconds;
        updateTimerDisplay();

        const timerBox = document.getElementById('timer-box');
        timerBox.classList.remove('timer-urgent');

        timerInterval = setInterval(() => {
            timeLeft--;
            updateTimerDisplay();

            if (timeLeft === 30) {
                // 剩最後 30 秒，進入急迫狀態（紅底並微顫動）
                timerBox.classList.add('timer-urgent');
                speakWarning();
            }

            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                endGame(true); // 傳入 true 表示時間結束
            }
        }, 1000);
    }

    function updateTimerDisplay() {
        const minutes = Math.floor(timeLeft / 60);
        const seconds = timeLeft % 60;
        const displayString = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
        document.getElementById('timer-display').innerText = displayString;
    }

    function speakWarning() {
        if ('speechSynthesis' in window) {
            const utterance = new SpeechSynthesisUtterance("Hurry up!");
            utterance.lang = 'en-US';
            utterance.rate = 1.0;
            window.speechSynthesis.speak(utterance);
        }
    }

    function loadQuestion() {
        if (currentIdx >= gameWords.length) {
            endGame(false);
            return;
        }

        isTransitioning = false;
        const currentWord = gameWords[currentIdx].w.toLowerCase();
        
        document.getElementById('question-number').innerText = `第 ${currentIdx + 1} / ${gameWords.length} 題`;
        document.getElementById('current-score').innerText = `得分: ${score}`;
        document.getElementById('progress').style.width = `${(currentIdx / gameWords.length) * 100}%`;
        document.getElementById('chinese-prompt').innerText = gameWords[currentIdx].ch;
        document.getElementById('feedback').innerText = '';

        currentAnswerArray = new Array(currentWord.length).fill('');
        usedTileIds = [];

        renderSlots();

        // 題目一出現立馬發音 (TTS)
        speakWord(currentWord);

        // 準備混淆字母
        let letters = currentWord.split('');
        const alphabet = 'abcdefghijklmnopqrstuvwxyz';
        
        let extraCount = 3;
        while(extraCount > 0) {
            let randomLetter = alphabet[Math.floor(Math.random() * 26)];
            letters.push(randomLetter);
            extraCount--;
        }

        letters.sort(() => Math.random() - 0.5);

        const poolContainer = document.getElementById('letter-pool');
        poolContainer.innerHTML = '';
        letters.forEach((letter, index) => {
            const tile = document.createElement('button');
            tile.className = 'letter-tile';
            tile.id = `tile-${index}`;
            tile.innerText = letter;
            tile.onclick = () => selectLetterTile(tile, letter, index);
            poolContainer.appendChild(tile);
        });
    }

    function renderSlots() {
        const slotsContainer = document.getElementById('slots');
        slotsContainer.innerHTML = '';
        currentAnswerArray.forEach(char => {
            const slot = document.createElement('div');
            slot.className = `slot ${char ? 'filled' : ''}`;
            slot.innerText = char;
            slotsContainer.appendChild(slot);
        });
    }

    function selectLetterTile(tileBtn, letter, tileId) {
        if (tileBtn.classList.contains('disabled') || isTransitioning) return;

        const emptyIdx = currentAnswerArray.indexOf('');
        if (emptyIdx !== -1) {
            currentAnswerArray[emptyIdx] = letter;
            tileBtn.classList.add('disabled');
            usedTileIds.push({ tileId: tileId, slotIdx: emptyIdx });
            renderSlots();

            if (!currentAnswerArray.includes('')) {
                checkSpellingAnswer();
            }
        }
    }

    function clearAnswer() {
        if (isTransitioning) return;
        const currentWord = gameWords[currentIdx].w.toLowerCase();
        currentAnswerArray = new Array(currentWord.length).fill('');
        usedTileIds = [];
        
        document.querySelectorAll('.letter-tile').forEach(tile => {
            tile.classList.remove('disabled');
        });
        document.getElementById('feedback').innerText = '';
        renderSlots();
    }

    function repeatCurrentWordAudio() {
        const targetWord = gameWords[currentIdx].w.toLowerCase();
        speakWord(targetWord);
    }

    function checkSpellingAnswer() {
        const targetWord = gameWords[currentIdx].w.toLowerCase();
        const userWord = currentAnswerArray.join('');
        const feedback = document.getElementById('feedback');

        if (userWord === targetWord) {
            isTransitioning = true;
            feedback.innerHTML = '<span class="text-success">🎉 太棒了！全對了！</span>';
            score += Math.round(100 / gameWords.length);
            
            speakWord(targetWord);
            
            setTimeout(() => {
                currentIdx++;
                loadQuestion();
            }, 1500);
        } else {
            feedback.innerHTML = '<span class="text-danger">❌ 喔喔，字母順序不對唷，再試一次！</span>';
            if (!wrongWords.includes(gameWords[currentIdx])) {
                wrongWords.push(gameWords[currentIdx]);
            }
        }
    }

    function speakWord(word) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(word);
            utterance.lang = 'en-US';
            utterance.rate = 0.8; 
            window.speechSynthesis.speak(utterance);
        }
    }

    function endGame(isTimeUp = false) {
        clearInterval(timerInterval);
        document.getElementById('progress').style.width = '100%';
        switchScreen('screen-result');
        
        if (score > 100 || wrongWords.length === 0) score = 100;
        document.getElementById('final-score').innerText = score;

        const resultTitle = document.getElementById('result-title');
        const resultMessage = document.getElementById('result-message');

        if (isTimeUp) {
            resultTitle.innerText = "時間到囉！⏳";
            resultMessage.innerText = "別灰心！多練習幾次，拼字速度就會變快喔！";
            // 把時間到時還沒寫的單字放入錯題本
            for (let i = currentIdx; i < gameWords.length; i++) {
                if (!wrongWords.includes(gameWords[i])) {
                    wrongWords.push(gameWords[i]);
                }
            }
        } else {
            resultTitle.innerText = "挑戰成功 🎉";
            let msg = "再練習看看，你一定會越來越厲害！👍";
            if (score === 100) msg = "太厲害了！你是英文字母小天才！ 🌟";
            else if (score >= 70) msg = "很棒喔！單字記得真清楚！ ❤️";
            resultMessage.innerText = msg;
        }

        const reviewSection = document.getElementById('review-section');
        const reviewList = document.getElementById('review-list');
        if (wrongWords.length > 0) {
            reviewSection.style.display = 'block';
            reviewList.innerHTML = '';
            wrongWords.forEach(item => {
                reviewList.innerHTML += `<div style="padding:5px 0; border-bottom:1px solid #ddd;">💡 <strong>${item.ch}</strong> 的正確拼法是：<span style="color:#2980B9; font-weight:bold; text-transform:uppercase;">${item.w}</span></div>`;
            });
        } else {
            reviewSection.style.display = 'none';
        }
    }

    // 回首頁確認與邏輯
    function confirmReturnToMenu() {
        document.getElementById('confirm-dialog').style.display = 'flex';
    }

    function closeConfirmDialog() {
        document.getElementById('confirm-dialog').style.display = 'none';
    }

    function exitToMenu() {
        clearInterval(timerInterval);
        closeConfirmDialog();
        switchScreen('screen-menu');
    }

    function returnToMenu() {
        switchScreen('screen-menu');
    }

    function switchScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
    }
</script>
